schema: spec-driven
context: |
  Garden Chat is a multiplayer social garden, not a scored game. Public repository
  SamuelAsherRivello/babylon-lite-garden-chat generated from the required template.
  Keep project-name/ as application root per AGENTS.md; npm root remains repository.
  Use Babylon Lite 1.32.0 with WebGPU, Vite, and exact released @rmc/multiplayer-client 0.3.0.
  Shared server garden-chat room is released and live verified, 12 anonymous visitors,
  server authority for bounds/collisions and 100 in-memory chat messages.
  No accounts, durable chat, interior obstacles, scoring or global reset.
  Original Blender GLB art, desktop WASD/arrows and touch controls, portrait world,
  responsive shared chat. Stop input on focus loss, pause or text entry.
  Verify npm test, npm run build and two-browser interaction; deploy GitHub Pages.
  User explicitly requests explore then apply for each major system and full delivery.
